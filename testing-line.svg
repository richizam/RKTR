    <circle class="status-dot" cx="112" cy="8" r="5"/>
    <text class="op-code" style="text-anchor:start" x="8" y="11">OP50</text>
    <image href="images/op50-op100-wash.png" xlink:href="images/op50-op100-wash.png" x="4" y="18" width="112" height="52" preserveAspectRatio="xMidYMid meet"/>
