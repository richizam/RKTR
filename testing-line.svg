    <image href="images/op70-ultrasonic.png" xlink:href="images/op70-ultrasonic.png" x="4" y="18" width="112" height="52" preserveAspectRatio="xMidYMid meet"/>
    <text class="ctrl-label" x="60" y="86">PC/PLC</text>
    <line class="monitor-link" x1="60" y1="92" x2="60" y2="116"/>
