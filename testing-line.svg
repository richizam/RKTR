<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920"
     height="1080"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Railway wheel testing line - RKTR / MAG India MES schematic">
  <title>Testing Line — RKTR / MAG India</title>

  <style>
    .bg { fill: #0a1825; }
    .grid { stroke: #142c3f; stroke-width: .6; opacity: .55; }
    .cad-line { stroke: #3ae0ff; stroke-width: 1; fill: none; opacity: .62; stroke-linecap: round; stroke-linejoin: round; }
    .title { fill: #e5e7eb; font: 650 25px "Segoe UI", Arial, sans-serif; letter-spacing: 1.2px; }
    .subtitle { fill: #8a98a8; font: 400 12px "Segoe UI", Arial, sans-serif; letter-spacing: .6px; }
    .source-zone { fill: none; stroke: #d946ef; stroke-width: 2; stroke-dasharray: 12 8; opacity: .86; }
    .source-label { fill: #d946ef; font: 650 14px "Segoe UI", Arial, sans-serif; letter-spacing: 1px; }
    .rail { stroke: #3ae0ff; stroke-width: 2; opacity: .74; }
    .rail-tick { stroke: #3ae0ff; stroke-width: .8; opacity: .42; }
    .rail-label { fill: #facc15; font: 650 9.5px "Segoe UI", Arial, sans-serif; letter-spacing: .5px; }
    .station-frame { fill: #0e2233; stroke: #3ae0ff; stroke-width: 1.2; transition: stroke .16s, filter .16s; }
    .station:hover .station-frame { stroke: #7ff0ff; filter: drop-shadow(0 0 6px #3ae0ff); cursor: pointer; }
    .label-box { fill: #081827; stroke: #1c8da3; stroke-width: 1.05; }
    .station-num { fill: #e5e7eb; font: 650 10px "Segoe UI", Arial, sans-serif; }
    .station-label { fill: #e5e7eb; font: 650 7.7px "Segoe UI", Arial, sans-serif; text-anchor: middle; letter-spacing: .1px; }
    .station-sublabel { fill: #a8b5c3; font: 500 7px "Segoe UI", Arial, sans-serif; text-anchor: middle; letter-spacing: .1px; }
    .op-code { fill: #7ddf4a; font: 650 7px Consolas, monospace; text-anchor: middle; }
    .ctrl-label { fill: #3ae0ff; font: 500 6.5px Consolas, "Courier New", monospace; text-anchor: middle; letter-spacing: .1px; }
    .monitor-link { stroke: #7ddf4a; stroke-width: 1.2; opacity: .85; }
    .status-dot { stroke: #0a1825; stroke-width: 1.2; }
    .status-idle .status-dot { fill: #6b7785; }
    .status-running .status-dot { fill: #4ade80; animation: dot-pulse 2.4s ease-in-out infinite; }
    .status-warning .status-dot { fill: #fbbf24; }
    .status-error .status-dot { fill: #ef4444; }
    .status-offline .status-dot { fill: #4b5563; }
    @keyframes dot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    .gantry { transform-box: fill-box; transform-origin: center; }
    .flow { stroke: #4ade80; stroke-width: 4; fill: none; opacity: .92; }
    .flow-label { fill: #4ade80; font: 650 12px "Segoe UI", Arial, sans-serif; letter-spacing: 1px; }
    .legend-box { fill: #0e2233; stroke: #213a52; stroke-width: 1.2; }
    .legend-title { fill: #e5e7eb; font: 650 13px "Segoe UI", Arial, sans-serif; letter-spacing: .8px; }
    .legend-text { fill: #cbd5e1; font: 500 10.5px "Segoe UI", Arial, sans-serif; }
    .wheel-anchor { cursor: pointer; }
    .wheel-anchor:hover { filter: drop-shadow(0 0 7px #4ade80); }
    .wheel-sprite { cursor: pointer; pointer-events: all; }
    @media (prefers-reduced-motion: reduce) {
      .status-running .status-dot { animation: none; }
    }
  </style>

  <defs>
    <marker id="arrow-flow-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4ade80"/>
    </marker>

    <symbol id="icon-gantry-t" viewBox="0 0 70 88">
      <rect x="8" y="8" width="54" height="22" rx="2" fill="#facc15" stroke="#f97316" stroke-width="1.4"/>
      <rect x="18" y="30" width="34" height="9" fill="#f97316"/>
      <rect x="26" y="39" width="18" height="34" fill="#facc15" stroke="#f97316" stroke-width="1.2"/>
      <path d="M35 73 L26 84 L44 84 Z" fill="#f97316"/>
      <line x1="35" y1="0" x2="35" y2="8" stroke="#facc15" stroke-width="2"/>
      <circle cx="35" cy="0" r="3" fill="#facc15"/>
    </symbol>

    <symbol id="icon-wheel-t" viewBox="0 0 82 82">
      <circle cx="41" cy="41" r="34" fill="#0e2233" stroke="#4ade80" stroke-width="1.6"/>
      <circle cx="41" cy="41" r="22" fill="none" stroke="#4ade80" stroke-width="1.1"/>
      <circle cx="41" cy="41" r="6" fill="#4ade80"/>
      <line x1="41" y1="7" x2="41" y2="75" stroke="#4ade80" stroke-width="1.1"/>
      <line x1="7" y1="41" x2="75" y2="41" stroke="#4ade80" stroke-width="1.1"/>
      <line x1="17" y1="17" x2="65" y2="65" stroke="#4ade80" stroke-width="1"/>
      <line x1="65" y1="17" x2="17" y2="65" stroke="#4ade80" stroke-width="1"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <!-- Grid -->
  <g>
    <line class="grid" x1="0" y1="270" x2="1920" y2="270"/>
    <line class="grid" x1="0" y1="540" x2="1920" y2="540"/>
    <line class="grid" x1="0" y1="810" x2="1920" y2="810"/>
    <line class="grid" x1="320" y1="0" x2="320" y2="1080"/>
    <line class="grid" x1="960" y1="0" x2="960" y2="1080"/>
    <line class="grid" x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>

  <!-- Title -->
  <g transform="translate(40 48)">
    <text class="title">TESTING LINE — RKTR / MAG India</text>
    <text class="subtitle" y="25">12 monitored stations · 3 linear-gantry heads LG3–LG5 (Sinumerik One) · OP40→OP50→OP60→OP70(×3)→OP80→OP90→OP100→OP110→OP130→OP140</text>
  </g>
  <text class="subtitle" x="1880" y="48" text-anchor="end">REV 1.0 · 1920×1080</text>

  <!-- Source zone outline -->
  <rect class="source-zone" x="42" y="238" width="1836" height="462" rx="22"/>
  <text class="source-label" x="960" y="232" text-anchor="middle">TESTING LINE — OP40 THROUGH OP140</text>

  <!-- Gantry rail -->
  <g id="testing-gantry-rail">
    <line class="rail" x1="92" y1="160" x2="1828" y2="160"/>
    <line class="rail" x1="92" y1="216" x2="1828" y2="216"/>
    <g class="rail-tick">
      <line x1="210" y1="160" x2="210" y2="216"/><line x1="330" y1="160" x2="330" y2="216"/>
      <line x1="450" y1="160" x2="450" y2="216"/><line x1="570" y1="160" x2="570" y2="216"/>
      <line x1="690" y1="160" x2="690" y2="216"/><line x1="810" y1="160" x2="810" y2="216"/>
      <line x1="930" y1="160" x2="930" y2="216"/><line x1="1050" y1="160" x2="1050" y2="216"/>
      <line x1="1170" y1="160" x2="1170" y2="216"/><line x1="1290" y1="160" x2="1290" y2="216"/>
      <line x1="1410" y1="160" x2="1410" y2="216"/><line x1="1530" y1="160" x2="1530" y2="216"/>
      <line x1="1650" y1="160" x2="1650" y2="216"/><line x1="1770" y1="160" x2="1770" y2="216"/>
    </g>
    <text class="rail-label" x="92" y="149">LINEAR GANTRY RAIL</text>
  </g>

  <!-- Gantry heads (0-indexed in script, labelled 3-5 visually) -->
  <g class="gantry gantry-1">
    <use href="#icon-gantry-t" x="311" y="116" width="70" height="88"/>
    <text class="rail-label" x="346" y="108" text-anchor="middle">LINEAR GANTRY 3</text>
  </g>
  <g class="gantry gantry-2">
    <use href="#icon-gantry-t" x="891" y="116" width="70" height="88"/>
    <text class="rail-label" x="926" y="108" text-anchor="middle">LINEAR GANTRY 4</text>
  </g>
  <g class="gantry gantry-3">
    <use href="#icon-gantry-t" x="1487" y="116" width="70" height="88"/>
    <text class="rail-label" x="1522" y="108" text-anchor="middle">LINEAR GANTRY 5</text>
  </g>

  <!-- FEED CONVEYOR -->
  <g id="feed-conveyor-testing" data-zone-id="Z-FEED" data-zone-kind="conveyor" transform="translate(50 362)">
    <rect class="label-box" x="0" y="0" width="42" height="54" rx="3"/>
    <text class="station-label" x="21" y="22">FEED</text>
    <text class="station-label" x="21" y="36">CONV</text>
    <line stroke="#4ade80" stroke-width="2.4" x1="42" y1="27" x2="58" y2="27" marker-end="url(#arrow-flow-t)" opacity="0.92"/>
  </g>

  <!-- Station macro: TX spacing = 149px, box width = 120px, box height = 92px, Y = 248 -->

  <!-- STATION 01: OP40 Balancing -->
  <g id="station-test-01" class="station status-running"
     data-station-name="OP40 BALANCING STATION"
     data-machine-id="RKTR-OP40-BAL-01"
     data-zone-id="Z-OP40"
     data-zone-kind="station"
     data-controller="IPC/PLC"
     transform="translate(108 248)">
    <rect class="station-frame" x="0" y="0" width="120" height="92" rx="3"/>
    <circle class="status-dot" cx="112" cy="8" r="5"/>
    <text class="op-code" style="text-anchor:start" x="8" y="11">OP40</text>
    <image href="images/op40-balance.png" xlink:href="images/op40-balance.png" x="4" y="18" width="112" height="52" preserveAspectRatio="xMidYMid meet"/>
    <text class="ctrl-label" x="60" y="86">IPC/PLC</text>
    <line class="monitor-link" x1="60" y1="92" x2="60" y2="116"/>
    <circle class="status-dot" cx="60" cy="116" r="6"/>
    <rect class="label-box" x="-6" y="128" width="132" height="56" rx="3"/>
    <text class="op-code" x="60" y="141">OP40</text>
    <text class="station-label" x="60" y="154">BALANCING</text>
    <text class="station-label" x="60" y="167">STATION</text>
  </g>

