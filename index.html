<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RKTR / MAG India - Railway Wheel MES Visualization</title>

<body>
  <header class="page-header">

      <h1>Railway Wheel Production - MES / Traceability View</h1>
