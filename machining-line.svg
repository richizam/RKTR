    <text class="station-label" x="30" y="24">INFEED</text>
    <text class="station-label" x="30" y="42">BUFFER</text>
    <line stroke="#4ade80" stroke-width="2.8" x1="60" y1="30" x2="76" y2="30" marker-end="url(#arrow-flow-m)" opacity="0.92"/>
  </g>

  <!-- STATION 01: OP05 Camera -->
  <g id="station-mach-01" class="station status-running"
