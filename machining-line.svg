<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920"
     height="1080"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Railway wheel machining line - RKTR / MAG India MES schematic">
  <title>Machining Line — RKTR / MAG India</title>

  <style>
    .bg { fill: #0a1825; }
    .grid { stroke: #142c3f; stroke-width: .6; opacity: .55; }
    .cad-line { stroke: #3ae0ff; stroke-width: 1; fill: none; opacity: .62; stroke-linecap: round; stroke-linejoin: round; }
    .cad-faint { stroke: #6b7785; stroke-width: .8; fill: none; opacity: .2; }
    .title { fill: #e5e7eb; font: 650 25px "Segoe UI", Arial, sans-serif; letter-spacing: 1.2px; }
    .subtitle { fill: #8a98a8; font: 400 12px "Segoe UI", Arial, sans-serif; letter-spacing: .6px; }
    .source-zone { fill: none; stroke: #facc15; stroke-width: 2; stroke-dasharray: 12 8; opacity: .82; }
    .source-label { fill: #facc15; font: 650 14px "Segoe UI", Arial, sans-serif; letter-spacing: 1px; }
    .rail { stroke: #3ae0ff; stroke-width: 2; opacity: .74; }
    .rail-tick { stroke: #3ae0ff; stroke-width: .8; opacity: .42; }
    .rail-label { fill: #facc15; font: 650 11px "Segoe UI", Arial, sans-serif; letter-spacing: .8px; }
    .station-frame { fill: #0e2233; stroke: #3ae0ff; stroke-width: 1.4; transition: stroke .16s, filter .16s; }
    .station:hover .station-frame { stroke: #7ff0ff; filter: drop-shadow(0 0 6px #3ae0ff); cursor: pointer; }
    .label-box { fill: #081827; stroke: #1c8da3; stroke-width: 1.2; }
    .station-num { fill: #e5e7eb; font: 650 12px "Segoe UI", Arial, sans-serif; }
    .station-label { fill: #e5e7eb; font: 650 10.5px "Segoe UI", Arial, sans-serif; text-anchor: middle; letter-spacing: .35px; }
    .station-sublabel { fill: #a8b5c3; font: 500 9px "Segoe UI", Arial, sans-serif; text-anchor: middle; letter-spacing: .25px; }
    .op-code { fill: #7ddf4a; font: 650 9px Consolas, monospace; text-anchor: middle; }
    .ctrl-label { fill: #3ae0ff; font: 500 7.5px Consolas, "Courier New", monospace; text-anchor: middle; letter-spacing: .2px; }
    .monitor-link { stroke: #7ddf4a; stroke-width: 1.4; opacity: .85; }
    .status-dot { stroke: #0a1825; stroke-width: 1.4; }
    .status-idle .status-dot { fill: #6b7785; }
    .status-running .status-dot { fill: #4ade80; animation: dot-pulse 2.4s ease-in-out infinite; }
    .status-warning .status-dot { fill: #fbbf24; }
    .status-error .status-dot { fill: #ef4444; }
    .status-offline .status-dot { fill: #4b5563; }
    @keyframes dot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    .glyph { stroke: #3ae0ff; stroke-width: 1.35; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .glyph-fill { fill: #142b3e; stroke: #3ae0ff; stroke-width: 1.1; }
    .glyph-accent { fill: #f97316; stroke: #facc15; stroke-width: .6; }
    .gantry { transform-box: fill-box; transform-origin: center; }
    .flow { stroke: #4ade80; stroke-width: 4; fill: none; opacity: .92; }
    .flow-label { fill: #4ade80; font: 650 12px "Segoe UI", Arial, sans-serif; letter-spacing: 1px; }
    .legend-box { fill: #0e2233; stroke: #213a52; stroke-width: 1.2; }
    .legend-title { fill: #e5e7eb; font: 650 13px "Segoe UI", Arial, sans-serif; letter-spacing: .8px; }
    .legend-text { fill: #cbd5e1; font: 500 10.5px "Segoe UI", Arial, sans-serif; }
    .wheel-anchor { cursor: pointer; }
    .wheel-anchor:hover { filter: drop-shadow(0 0 7px #4ade80); }
    .wheel-sprite { cursor: pointer; pointer-events: all; }
    @media (prefers-reduced-motion: reduce) {
      .status-running .status-dot { animation: none; }
    }
  </style>

  <defs>
    <marker id="arrow-flow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4ade80"/>
    </marker>

    <!-- Gantry head icon (unchanged) -->
    <symbol id="icon-gantry-m" viewBox="0 0 70 88">
      <rect x="8" y="8" width="54" height="22" rx="2" fill="#facc15" stroke="#f97316" stroke-width="1.4"/>
      <rect x="18" y="30" width="34" height="9" fill="#f97316"/>
      <rect x="26" y="39" width="18" height="34" fill="#facc15" stroke="#f97316" stroke-width="1.2"/>
      <path d="M35 73 L26 84 L44 84 Z" fill="#f97316"/>
      <line x1="35" y1="0" x2="35" y2="8" stroke="#facc15" stroke-width="2"/>
      <circle cx="35" cy="0" r="3" fill="#facc15"/>
    </symbol>

    <!-- Wheel sprite icon -->
    <symbol id="icon-wheel-m" viewBox="0 0 82 82">
