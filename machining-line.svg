    <text class="op-code" style="text-anchor:start" x="10" y="13">OP10/20</text>
    <image href="images/op10-vtl.png" xlink:href="images/op10-vtl.png" x="4" y="22" width="172" height="80" preserveAspectRatio="xMidYMid meet"/>
    <text class="ctrl-label" x="90" y="117">Sinumerik One</text>
    <line class="monitor-link" x1="90" y1="124" x2="90" y2="154"/>
