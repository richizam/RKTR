    <text class="op-code" style="text-anchor:start" x="10" y="13">OP05</text>
    <use href="#icon-camera-m" x="4" y="22" width="172" height="80"/>
    <text class="ctrl-label" x="90" y="117">IPC/PLC</text>
    <line class="monitor-link" x1="90" y1="124" x2="90" y2="154"/>
    <circle class="status-dot" cx="90" cy="154" r="7"/>
    <rect class="label-box" x="-8" y="168" width="196" height="52" rx="4"/>
    <text class="station-label" x="90" y="188">CAMERA</text>
    <text class="station-sublabel" x="90" y="206">WHEEL ID STATION</text>
  </g>

